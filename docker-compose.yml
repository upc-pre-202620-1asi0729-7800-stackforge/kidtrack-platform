services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kidtrack-platform:1.0.0
    container_name: kidtrack-platform
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: kidtrack_platform
      DATABASE_USERNAME: kidtrack
      DATABASE_PASSWORD: kidtrack_password
      # Local development value. Use your own secret (at least 32 characters) when deploying.
      JWT_SECRET: kidtrack-compose-dev-secret-change-me-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.4
    container_name: kidtrack-mysql
    environment:
      MYSQL_DATABASE: kidtrack_platform
      MYSQL_USER: kidtrack
      MYSQL_PASSWORD: kidtrack_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - kidtrack-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukidtrack -pkidtrack_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  kidtrack-mysql-data:
