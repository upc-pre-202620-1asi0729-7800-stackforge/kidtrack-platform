# Production profile
# Every connection value comes from the environment; there are no defaults for credentials or secrets.
spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME}?useSSL=${DATABASE_SSL:true}&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD}

# The schema is created and updated by Hibernate (there is no migration tool yet)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}

# JWT secret (at least 32 characters). The application does not start without it.
kidtrack.security.jwt.secret=${JWT_SECRET}

# No demo data in production unless explicitly requested
kidtrack.seed.enabled=${SEED_ENABLED:false}

# Swagger is off unless SWAGGER_ENABLED=true
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
