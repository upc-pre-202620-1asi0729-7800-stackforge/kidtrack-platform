# Development profile
# Use Dockerfile-compatible environment variable names with local defaults.
# Set DATABASE_PASSWORD to the password of your local MySQL user (do not write it in this file).
spring.datasource.url=jdbc:mysql://${DATABASE_URL:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:kidtrack_platform}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# App port
server.port=${PORT:8080}
# Swagger UI: http://localhost:8080/swagger-ui/index.html

# JWT secret for local development only (at least 32 characters)
kidtrack.security.jwt.secret=${JWT_SECRET:kidtrack-dev-only-secret-change-me-0123456789}

# Demo organization, accounts, routes and trips are loaded when the database is empty
kidtrack.seed.enabled=${SEED_ENABLED:true}
