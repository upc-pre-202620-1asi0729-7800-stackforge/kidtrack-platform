# Settings shared by every profile. The profile-specific values live in application-dev.properties and
# application-prod.properties; the active profile is chosen with SPRING_PROFILES_ACTIVE (dev by default).
spring.application.name=kidtrack-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Identifiers are stored as readable CHAR(36) values instead of BINARY(16)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=always
server.forward-headers-strategy=framework

# JWT and CORS (the secret itself is defined per profile)
kidtrack.security.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}
# Comma separated list of allowed origins; empty accepts any origin
kidtrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
